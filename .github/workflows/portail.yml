name: Portail

# Publie le dossier site/ (généré par `omega render`, contrôlé par la CI) sur l'hébergement de pages du dépôt.
# Ne tourne que si site/ change sur main, ou à la main. Sans effet tant que le propriétaire n'a pas activé la
# publication dans les réglages du dépôt (DECISIONS.md, D9).
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portail
  cancel-in-progress: false

jobs:
  publier:
    name: Publier site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
