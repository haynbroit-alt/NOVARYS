[claim.falsification]
description = "Mutation : dans une copie, la garde ne reconnaît plus les adresses e-mail. Le test des fuites, vert sur la copie intacte (témoin), doit alors échouer."
command = 'bash "$OMEGA_ROOT/registre/sondes/mutation_mere.sh" garde'
exit_code = 1
output_regex = '^FAIL: test_fuites_detectees'

[[claim]]
id = "mere-encaisse-exige-la-banque"
domain = "BUSINESS"
capability = "L'étape « encaissé » de la mère n'est franchie que si la banque confirme le crédit, net des frais"
