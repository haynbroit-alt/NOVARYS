output_regex = "outils d'approbation ou d'encaissement : \\[\\]$"
scope = "Les outils réellement exposés par le serveur MCP du moteur au commit épinglé."
limits = "Le contrôle lit les noms des outils ; c'est l'attaque qui éprouve leur effet, sur quatre voies seulement. Jusqu'au commit 62ecac3, le filtre de surface laissait passer l'alias « encaissements » et seul le registre refusait ; les deux refusent désormais. L'approbation en ligne de commande n'est pas réservée techniquement à un humain : la barrière réelle est que l'agent n'y a pas recours et que les PR sont relues."
tags = ["ci", "scenario-6"]

[claim.falsification]
description = "Un agent tente de se déclarer 100 000 € d'encaissement par quatre voies (import CSV sous deux noms, compétence finance en direct, facture émise puis déclarée encaissée), puis demande une dépense."
command = 'SOVEREIGN_HOME="$OMEGA_TMP/espace" uv run python "$OMEGA_ROOT/registre/sondes/outils_mcp.py" attaquer'
output_regex = '^4 tentatives d.encaissement par un agent ; enveloppe de dépense : 0\.00 €$'

# ------------------------------------------------------------------------------------- ENTREPRISE MÈRE

[[claim]]
id = "mere-suite-verifiee"
domain = "BUSINESS"
capability = "L'entreprise mère passe ses tests adversariaux, et son portefeuille et ses sorties publiques sont valides"
subject = "mere"
command = '''python3 -m unittest discover -s tests && python3 -m mere verifier'''
output_regex = '^OK : \d+ opportunité'
scope = "Mère au commit épinglé, bibliothèque standard seule, données de test pour l'argent (faux prestataire), portefeuille et sorties publiques réels du dépôt."
limits = "Une suite verte prouve ce que la suite teste. Les contrôles réseau (pages publiques, sites des prospects, prestataire de paiement) ne sont pas rejoués ici : ils exigent le réseau ou une clé."
tags = ["ci"]

[claim.falsification]
description = "Mutation : dans une copie de la mère, un paiement en mode test est compté comme encaissé. Le test qui l'interdit, vert sur la copie intacte (témoin), doit alors échouer."
command = 'bash "$OMEGA_ROOT/registre/sondes/mutation_mere.sh" livemode'
exit_code = 1
output_regex = '^FAIL: test_paiement_en_mode_test_ignore'

[[claim]]
id = "mere-garde-anti-fuite"
domain = "BUSINESS"
capability = "La garde de l'entreprise mère refuse les données personnelles et financières dans les sorties publiques"
subject = "mere"
command = '''python3 -m unittest discover -s tests -k Garde -k test_f05 -k test_f04 -k test_rien_de_public'''
output_regex = '^OK$'
scope = "Motifs de la garde (e-mail, téléphone, SIREN et SIRET, TVA, identifiants et clés de paiement, identifiants de message, montants) et ordre d'écriture : rien de public avant la garde."
limits = "Une garde par motifs ne voit pas un nom propre isolé : les adaptateurs ne recopient donc jamais le contenu d'une cellule dans un message."
