[project]
name = "novarys-omega"
version = "0.1.0"
description = "NOVARYS Ω — protocole de preuves : une capacité revendiquée est exécutée, attaquée, reproduite et consignée."
readme = "README.md"
requires-python = ">=3.12"
# Bibliothèque standard uniquement : l'outil de preuve doit pouvoir tourner partout, sans rien installer.
dependencies = []

[project.scripts]
omega = "novarys_omega.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novarys_omega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
    "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
    "RUF001", "RUF002", "RUF003",  # le français utilise des caractères typographiques
]

[tool.ruff.lint.per-file-ignores]
# Exécuter la commande déclarée par le référentiel est la fonction même de l'outil (voir runner.py, « Sécurité »).
"src/novarys_omega/runner.py" = ["S603", "S607"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novarys_omega"]
mypy_path = "src"
